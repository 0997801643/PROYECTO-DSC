# Integración continua: corre en cada push y en cada pull request.
# Falla si falla cualquier prueba (incluida la que verifica la métrica del modelo)
# o si la imagen Docker de la API no se puede construir.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    name: Pruebas de la API e imagen Docker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proyecto_final

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: proyecto_final/api/requirements.txt

      - name: Instalar dependencias (las mismas de la imagen + pytest)
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt pytest==8.3.3 httpx==0.27.2

      - name: Correr las pruebas
        run: pytest tests -v

      - name: Construir la imagen Docker de la API
        run: docker build -f api/Dockerfile -t api-merma:ci .