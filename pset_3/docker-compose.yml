# PSet 3 · Servidor de tracking de MLflow
# Backend store: SQLite (parámetros, métricas, tags y Model Registry)
# Artifact store: carpeta /mlflow/artifacts (modelos entrenados, gráficos)
# Ambos viven en el volumen "datos_mlflow": no se pierden al apagar el contenedor.
services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    container_name: mlflow_pset3
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --host 0.0.0.0
      --port 5000
    ports:
      - "5050:5000"   # en Mac el puerto 5000 lo ocupa AirPlay; se usa 5050
    volumes:
      - datos_mlflow:/mlflow
    restart: unless-stopped

volumes:
  datos_mlflow: