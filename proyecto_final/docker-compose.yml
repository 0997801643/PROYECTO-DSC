services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}          # en el .env, no en el repositorio
    volumes:
      - datos_postgres:/var/lib/postgresql

  kestra:
    image: kestra/kestra:v2.0.7
    user: "root"
    command: server standalone
    env_file: .env
    volumes:
      - datos_kestra:/app/storage
      - ./data:/app/data-fuente
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kestra-wd:/tmp/kestra-wd
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: ${POSTGRES_PASSWORD}
        kestra:
          server:
            basic-auth:
              username: admin@kestra.io
              password: ${KESTRA_ADMIN_PASSWORD}
          repository:
            type: postgres
          storage:
            type: local
            local:
              base-path: "/app/storage"
          queue:
            type: postgres
          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp
          url: http://localhost:8080/
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --host 0.0.0.0
      --port 5000
    ports:
      - "5050:5000"
    volumes:
      - datos_mlflow:/mlflow
    restart: unless-stopped

  # API de predicción (sección 2 del PSet 4)
  # Usa la imagen que publica el CD en GHCR (sección 7.3). Para construirla en local:
  #   docker build -f api/Dockerfile -t ghcr.io/0997801643/api-merma:latest .
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: ghcr.io/0997801643/api-merma:latest
    env_file: .env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000        # red interna de Docker
      SNOWFLAKE_PRIVATE_KEY_PATH: /keys/rsa_key.p8
      REGISTRAR_SNOWFLAKE: "1"                       # cada predicción va a la tabla PREDICCIONES
      RUTA_REGISTROS: /app/registros
      MODO_RESPALDO: "${MODO_RESPALDO:-0}"           # interruptor de respaldo (sección 8.4)
    volumes:
      - ./keys:/keys:ro
      - ./registros:/app/registros
    ports:
      - "8000:8000"
    depends_on:
      - mlflow

  # Tablero de monitoreo (sección 6.2 del PSet 4): http://localhost:8501
  tablero:
    build:
      context: .
      dockerfile: monitoreo/Dockerfile
    image: ghcr.io/0997801643/tablero-merma:latest
    env_file: .env
    environment:
      SNOWFLAKE_PRIVATE_KEY_PATH: /keys/rsa_key.p8
    volumes:
      - ./keys:/keys:ro
    ports:
      - "8501:8501"

  # Spark: el servicio se levanta con el compose y verifica la instalación (spark-submit --version).
  # El trabajo real (construir la OBT) lo lanza Kestra en cada ingesta (ingesta.yml) con esta
  # misma imagen. Para correrlo a mano:  docker compose --profile manual run --rm spark-obt
  spark:
    image: spark:3.5.1-python3
    user: root
    entrypoint: ["/opt/spark/bin/spark-submit", "--version"]
    restart: "no"

  # dbt también corre dentro de Kestra (ingesta.yml). A mano:
  #   docker compose --profile manual run --rm dbt build
  dbt:
    image: ghcr.io/dbt-labs/dbt-snowflake:1.9.latest
    profiles: ["manual"]
    env_file: .env
    working_dir: /usr/app
    environment:
      DBT_PROFILES_DIR: /usr/app
      SNOWFLAKE_PRIVATE_KEY_PATH: /keys/rsa_key.p8
    volumes:
      - ./dbt:/usr/app
      - ./keys:/keys:ro

  spark-obt:
    image: spark:3.5.1-python3
    profiles: ["manual"]
    user: root
    env_file: .env
    working_dir: /opt/spark-apps
    environment:
      SNOWFLAKE_PRIVATE_KEY_PATH: /keys/rsa_key.p8
    volumes:
      - ./spark:/opt/spark-apps
      - ./keys:/keys:ro
    entrypoint:
      - /opt/spark/bin/spark-submit
      - --conf
      - spark.jars.ivy=/tmp/.ivy2
      - --packages
      - net.snowflake:spark-snowflake_2.12:3.0.0,net.snowflake:snowflake-jdbc:3.16.1
    command: ["build_obt.py"]

volumes:
  datos_postgres:
    name: pset2_datos_postgres
  datos_kestra:
    name: pset2_datos_kestra
  datos_mlflow:
    name: pset_3_datos_mlflow